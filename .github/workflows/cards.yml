name: Redraw profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CARDS_TOKEN (a PAT) is optional; without it, private contributions aren't counted.
      - run: node scripts/build-cards.js
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git add assets/cards README.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redraw profile cards"
          git push
